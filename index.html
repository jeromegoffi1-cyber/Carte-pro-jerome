<style>
  :root{
    --ink:#14213D;
    --paper:#FBFAF8;
    --petrol:#0E5C56;
    --petrol-dark:#0A433F;
    --brass:#9C7A3C;
    --slate:#5B6472;
    --line:#DCD7CC;
    --card-w: 400px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:#EFEDE7;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:var(--card-w);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    box-shadow:0 18px 40px -20px rgba(20,33,61,0.25);
    padding:44px 36px 36px;
  }
  .mark{
    width:56px; height:56px;
    margin:0 auto 24px;
    border:1px solid var(--petrol);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Georgia, 'Times New Roman', serif;
    font-size:19px;
    font-weight:500;
    color:var(--petrol);
    letter-spacing:0.5px;
  }
  .identity{
    text-align:center;
    margin-bottom:22px;
  }
  .name{
    font-family:Georgia, 'Times New Roman', serif;
    font-size:26px;
    font-weight:500;
    color:var(--ink);
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  .title{
    font-size:13.5px;
    color:var(--slate);
    margin:0;
    line-height:1.5;
  }
  .rule{
    width:32px;
    height:1px;
    background:var(--brass);
    margin:22px auto;
  }
  .tagline{
    text-align:center;
    font-size:13px;
    color:var(--petrol-dark);
    letter-spacing:0.3px;
    margin:0 0 28px;
  }
  .contacts{
    border-top:1px solid var(--line);
  }
  .contact-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:14px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--ink);
  }
  .contact-row svg{
    flex-shrink:0;
    margin-top:2px;
    color:var(--petrol);
  }
  .contact-text{
    font-size:14px;
    line-height:1.45;
    word-break:break-word;
  }
  .contact-label{
    display:block;
    font-size:11px;
    color:var(--slate);
    margin-bottom:1px;
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:28px;
  }
  .btn{
    display:block;
    text-align:center;
    padding:13px 16px;
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    border-radius:2px;
    border:1px solid var(--petrol);
    cursor:pointer;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .btn-primary{
    background:var(--petrol);
    color:#fff;
  }
  .btn-primary:active{ background:var(--petrol-dark); }
  .btn-secondary{
    background:transparent;
    color:var(--petrol-dark);
    border-color:var(--line);
  }
  .hint{
    font-size:12.5px;
    line-height:1.5;
    color:var(--slate);
    background:#F3EFE6;
    border-left:2px solid var(--brass);
    padding:10px 12px;
    margin:14px 0 0;
  }
  .hint[hidden]{ display:none; }
  .qr-block{
    margin-top:32px;
    padding-top:26px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .qr-frame{
    display:inline-block;
    padding:10px;
    border:1px solid var(--brass);
    line-height:0;
  }
  .qr-frame svg{
    display:block;
    width:180px;
    height:180px;
  }
  .qr-caption{
    font-size:12px;
    color:var(--slate);
    margin-top:12px;
    line-height:1.5;
  }
</style>
</head>

<script>
(function(){
  var ua = navigator.userAgent || '';
  var hint = document.getElementById('hint');
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var inApp = /FBAN|FBAV|Instagram|Snapchat|LinkedInApp|Line\/|MicroMessenger|Twitter|GSA\/|; wv\)|\bwv\b/i.test(ua);
  var msg = '';
  if (inApp) {
    msg = 'Vous êtes dans le navigateur intégré d’une application, qui bloque l’enregistrement. Ouvrez cette page dans ' + (isIOS ? 'Safari' : 'Chrome') + ' (menu ⋯ ou ↗ « Ouvrir dans le navigateur »), puis touchez « Enregistrer le contact ».';
  } else if (isIOS) {
    msg = 'Sur la fiche qui s’ouvre, faites défiler tout en bas et touchez « Créer un nouveau contact » (le bouton n’est pas en haut, c’est iOS). Sinon : appui long sur le numéro de téléphone ci-dessus > « Ajouter aux contacts », ou scannez le QR code ci-dessous. Ouvrez cette page dans Safari, pas dans WhatsApp ou Messenger.';
  } else if (isAndroid) {
    msg = 'Touchez « Enregistrer le contact », puis ouvrez le fichier téléchargé (notification ou dossier Téléchargements) et choisissez « Contacts » pour l’importer.';
  }
  if (msg) { hint.textContent = msg; hint.hidden = false; }
})();
</script>
